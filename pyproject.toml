[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarcast"
version = "0.1.0"
description = "SolarCast NZ: next-hour solar power forecasts for all of New Zealand, with a map dashboard, EV charging advice and a local AI assistant"
requires-python = ">=3.10"
license = { text = "MIT" }
# Loose lower bounds only, so `pip install -e .` never fights Colab's preinstalled versions.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "requests>=2.28",
    "flask>=2.3",
]

[project.scripts]
solarcast-nz = "solarcast.nz.__main__:main"

[project.optional-dependencies]
demo = ["gradio>=4.0"]
dev = ["pytest>=7", "jupyterlab", "ipykernel", "nbconvert", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
