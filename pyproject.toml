[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarcast"
version = "0.1.0"
description = "SolarCast Lite: one-hour-ahead solar PV power forecasting (Veritas AI Hackathon 2026, AI + Climate)"
requires-python = ">=3.10"
license = { text = "All rights reserved; see LICENSE" }
# Loose lower bounds only, so `pip install -e .` never fights Colab's preinstalled versions.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "requests>=2.28",
]

[project.optional-dependencies]
demo = ["gradio>=4.0"]
dev = ["pytest>=7", "jupyterlab", "ipykernel", "nbconvert", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
